name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Test, build and release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      BUILD_NUMBER: ${{ github.run_number }}
      IS_RELEASE: ${{ github.event_name != 'pull_request' }}

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run unit tests and build debug APK
        run: ./gradlew testDebugUnitTest assembleDebug

      # Pull requests have no access to secrets, so only pushes build the signed release.
      - name: Build signed release APK
        if: env.IS_RELEASE == 'true'
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$SIGNING_KEYSTORE_BASE64" ] || [ -z "$SIGNING_KEYSTORE_PASSWORD" ]; then
            echo "::error::Add the SIGNING_KEYSTORE_BASE64 and SIGNING_KEYSTORE_PASSWORD repository secrets (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          export SIGNING_KEYSTORE_PATH="$RUNNER_TEMP/release.keystore"
          echo "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$SIGNING_KEYSTORE_PATH"
          ./gradlew assembleRelease
          mv app/build/outputs/apk/release/app-release.apk "just-focus-1.0.$BUILD_NUMBER.apk"

      - name: Publish GitHub release
        if: env.IS_RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.0.$BUILD_NUMBER" just-focus-*.apk \
            --title "Just Focus 1.0.$BUILD_NUMBER" \
            --notes "Download **just-focus-1.0.$BUILD_NUMBER.apk** below and open it on your phone to install." \
            --target "$GITHUB_SHA" \
            --latest

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: app/build/reports/tests/
